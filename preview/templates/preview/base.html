{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HRIS Import Preview{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="{% url 'upload' %}" class="navbar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Diversio HRIS Preview
        </a>
        <span style="font-size: 0.875rem; color: var(--text-muted);">Client Success Import Health Tool</span>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        Diversio Technical Exercise &bull; HRIS Import Preview Pipeline
    </footer>
</body>
</html>
